name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # pyright needs pandas to check Results.to_pandas.
      - run: uv sync --locked --extra pandas
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra pandas
      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv run pytest -q
          else
            # Fingerprint hashes are from macOS arm64; other platforms round floats differently.
            uv run pytest -q \
              --deselect tests/test_api.py::test_run_log_fingerprint \
              --deselect tests/test_api.py::test_results_fingerprint \
              --deselect tests/test_api.py::test_run_log_without_pid_matches_main \
              --deselect tests/test_api.py::test_no_click_stage_matches_main
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Check the wheel marks the package as typed
        run: unzip -l dist/*.whl | grep bidlab/py.typed
