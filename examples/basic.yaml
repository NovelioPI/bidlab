# Four bidders in a second-price auction. Run with:
#   uv run auction-sim run examples/basic.yaml --seeds 0-4 --out results.csv
episodes: 20
steps: 1000
seed: 0
auction:
  kind: second
  reserve: 0.01
world:
  context_dim: 8
  bias_mean: -3.0
  bias_std: 0.5
bidders:
  - name: truthful
    type: truthful
    budget: 50
    value_per_conversion: 5
  - name: shaded
    type: truthful
    budget: 50
    value_per_conversion: 5
    params:
      multiplier: 0.8
  - name: pid
    type: pid_pacing
    budget: 15
    value_per_conversion: 5
    cpa_target: 3
    episode_reward: cpa_score
  - name: bandit
    type: ucb_multiplier
    budget: 50
    value_per_conversion: 5
    reward: surplus
