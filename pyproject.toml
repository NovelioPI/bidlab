[project]
name = "auction-sim"
version = "0.1.0"
description = "Bidder-side ad auction simulator for research on bidding methods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
auction-sim = "auction_sim.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
