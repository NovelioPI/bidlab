[project]
name = "bidlab"
version = "0.1.0"
description = "Bidder-side ad auction simulator for research on bidding methods"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NovelioPI", email = "novelioputra99@gmail.com" },
]
keywords = ["ad auction", "bidding", "simulation", "online advertising"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cloudpickle>=3.0",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/NovelioPI/bidlab"
Source = "https://github.com/NovelioPI/bidlab"
Issues = "https://github.com/NovelioPI/bidlab/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.17.5",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mutmut]
source_paths = ["src/bidlab/"]
# Mutate only the core modules for this feature; the rest is copied so imports work.
do_not_mutate = [
    "src/bidlab/__init__.py",
    "src/bidlab/config.py",
    "src/bidlab/results.py",
    "src/bidlab/rewards.py",
    "src/bidlab/runner.py",
    "src/bidlab/simulator.py",
    "src/bidlab/types.py",
    "src/bidlab/bidders/*",
]
pytest_add_cli_args_test_selection = ["tests/"]
# The docs test reads docs/metrics.md from the mutants copy.
also_copy = ["docs/"]
# Example tests run the installed package in a subprocess, so they cannot see mutants.
pytest_add_cli_args = ["--ignore=tests/test_examples.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["D"]
# Magic methods such as __post_init__ and __len__ describe themselves.
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.pyright]
# Tests pass wrong types on purpose to check the error messages.
include = ["src"]
